name: Create Expression Page
on:
  workflow_dispatch:
    inputs:
      expression_id:
        description: "Expression ID (e.g. EXPREG_000014f0)"
        required: true
      html_content:
        description: "HTML content (base64 encoded)"
        required: true
      uniprot_accession:
        description: "UniProt accession (e.g. Q9A724)"
        required: false

permissions:
  contents: write

jobs:
  create-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate expression_id
        run: |
          set -euo pipefail
          EXPR_ID="${{ github.event.inputs.expression_id }}"
          if ! echo "$EXPR_ID" | grep -qE '^EXPREG_[a-f0-9A-F]+$'; then
            echo "Invalid expression_id: $EXPR_ID"
            exit 1
          fi
          echo "EXPR_ID=$EXPR_ID" >> $GITHUB_ENV

      - name: Write HTML file
        run: |
          set -euo pipefail
          mkdir -p "./public/$EXPR_ID"
          echo "${{ github.event.inputs.html_content }}" | base64 -d > "./public/$EXPR_ID/index.html"

      - name: Update uniprot_dbxref.txt if new entry
        run: |
          set -euo pipefail
          UNIPROT="${{ github.event.inputs.uniprot_accession }}"
          DBXREF_FILE="public/static/uniprot_dbxref.txt"

          # Solo actúa si se pasó uniprot_accession
          if [ -z "$UNIPROT" ]; then
            echo "No uniprot_accession provided, skipping dbxref update."
            exit 0
          fi

          # Comprueba si el EXPR_ID ya está en el archivo
          if grep -qF "$EXPR_ID" "$DBXREF_FILE"; then
            echo "$EXPR_ID already in $DBXREF_FILE, skipping."
            exit 0
          fi

          # Añade la nueva línea al final
          echo "${UNIPROT}	${EXPR_ID}" >> "$DBXREF_FILE"
          echo "Added: ${UNIPROT}	${EXPR_ID}"

      - name: Commit and push
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "./public/$EXPR_ID/index.html"
          git add "public/uniprot_dbxref.txt"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add expression page: $EXPR_ID"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
          git pull --rebase origin main
          git push origin main